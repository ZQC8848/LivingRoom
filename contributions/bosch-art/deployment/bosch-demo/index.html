<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bosch — The Garden of Earthly Delights | Living Room</title>
    <meta name="description" content="An interactive adaptation of Hieronymus Bosch's The Garden of Earthly Delights, c.1500, Prado Museum, Madrid. Reveal aligned panoramic layers with your hand; explore optional time studies and bounded live generation." />
    <meta property="og:title" content="Bosch — The Garden of Earthly Delights" />
    <meta property="og:description" content="A gesture reveals the world beneath the garden." />
    <meta property="og:url" content="https://livingroom-bosch-demo.sandy-toad-8179.chatgpt.site/" />
    <meta property="og:image" content="https://livingroom-bosch-demo.sandy-toad-8179.chatgpt.site/scenes/bosch-demo/media/poster.jpg" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.45 system-ui, sans-serif; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 2; max-width: min(520px, calc(100vw - 24px));
        color: #e6e3da; background: rgba(12, 12, 10, 0.72); padding: 10px 12px; border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; color: #cfc9b8; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      button, input { font: inherit; border-radius: 6px; border: 1px solid #5a564a; background: #24231f; color: #eee; padding: 5px 9px; }
      button:hover { background: #33312b; }
      button.primary { background: #c9b98a; color: #1a1812; border-color: #c9b98a; }
      input { flex: 1; min-width: 160px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="status">loading…</div>
      <div class="row">
        <button id="live" class="primary">Go live</button>
        <span style="align-self:center;color:#9d978a">drag to look · click the sky to ripple</span>
      </div>
      <div class="row" id="events"></div>
      <form class="row" id="steer">
        <input id="prompt" placeholder="Describe a change, e.g. 'snow begins to fall'" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
