<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Garden of Consequences · Motion review</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#151b18;color:#e6e9dd}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1680px;margin-inline:auto}header{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}h1{font:500 clamp(20px,3vw,30px) Georgia,serif;margin:0}a{color:#bfd9b4}p{color:#acb9ac;font-size:14px;line-height:1.6}button,select,input{font:inherit}button,select{background:#28362c;color:#e6e9dd;border:1px solid #4b604e;padding:9px 12px;border-radius:6px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #c4dfa9;outline-offset:3px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}input{min-width:100px;flex:1;accent-color:#b7d99a}label{font-size:14px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}canvas{width:100%;display:block;background:#0a100d;border:1px solid #334337;border-radius:4px;aspect-ratio:2}figcaption{padding:8px 0;color:#bdcbb9}#detail{color:#cfddc6;margin-bottom:14px;min-height:22px}#status{color:#b6c49b;font-size:13px}#region{max-width:360px}@media(max-width:800px){body{padding:14px}.views{grid-template-columns:1fr}select{max-width:100%}}
</style>
<header><h1>The Garden of Consequences</h1><a href="/">Enter the panorama ↗</a></header>
<p>Motion review · Choose a numbered region to inspect the complete object. G03 is intentionally still. Music continues across image loops.</p>
<div class="controls"><button id="play">Play</button><label for="region">View</label><select id="region"><option value="">Full painting</option></select><label for="rate">Speed</label><select id="rate"><option value="1">Normal</option><option value="0.5">Half speed</option></select><input aria-label="Playback position" id="seek" type="range" min="0" max="8" step="0.033" value="0"><span id="time">0.0 / 8.0 s</span></div>
<div id="detail">Full painting · 8-second loop</div><div class="views"><figure><canvas id="garden" width="1776" height="888"></canvas><figcaption>Garden</figcaption></figure><figure><canvas id="hell" width="1776" height="888"></canvas><figcaption>The hidden garden</figcaption></figure></div>
<div id="audio-controls"><button id="audio-world">Listen: Garden</button></div><p id="status" role="status">Loading the review film…</p>
<video id="video" hidden muted loop playsinline preload="auto"></video>
<script type="module">
import {createSoundscape} from '../audio/soundscape-r5.js';
const $=id=>document.getElementById(id),v=$('video'),select=$('region'),seek=$('seek');
const names={wind:'Foliage · breeze',flock:'Complete flock · small drift',water:'Water surface',waterfall:'Fountain · falling water','fire-smoke':'Distant city · flames and smoke',puppet:'Figures · small steps',static:'Intentionally still'};
const labels={G01:'Complete rider, mounts & branch · sway',G02:'Complete fish-boat · float',G03:'Tiny detail · intentionally still',G04:'Complete flock · small drift',G05:'Roof creature · rock / hidden smoke',G06:'Complete ornament · float',G07:'Two complete birds · wings',G08:'Tree · breeze / hidden city fire',G11:'Deer group · small steps',G13:'Strawberry · elastic movement',G14:'Complete bank bird · wing ruffle',G16:'Long-necked creature · sway',G19:'Small waterbird · wing',G20:'Large waterbird · open wing',G21:'Little stag · small steps',G22:'Pool figures · small gestures',G23:'Fish · float',H01:'Complete dark fish-boat · float',H03:'Complete dark ornament · float'};
const catalog=await (await fetch('motion-catalog.json',{cache:'no-cache'})).json();
for(const it of catalog.items){const o=document.createElement('option');o.value=it.id;o.textContent=`${it.id} · ${labels[it.id]||names[it.method]||it.action}`;select.append(o)}
const sound=createSoundscape({base:new URL('../audio/',location.href),parent:$('audio-controls'),embedded:true});window.__sound=sound;
let region=null,audioMix=0;
$('audio-world').onclick=()=>{audioMix=audioMix?0:1;$('audio-world').textContent=audioMix?'Listen: Hidden':'Listen: Garden';sound.update({mix:audioMix});};
select.onchange=()=>{region=catalog.items.find(i=>i.id===select.value)||null;$('detail').textContent=region?`${region.id} · ${labels[region.id]||names[region.method]||region.action}`:'Full painting · 8-second loop';draw()};
function draw(){if(v.readyState<2)return;for(const [id,row] of [['garden',0],['hell',1]]){const c=$(id),ctx=c.getContext('2d');let box=region?.box;if(box){let [a,b,d,e]=box;let w=Math.min(1774,Math.max(210,(d-a)*1.7,(e-b)*3.4)),h=w/2,x=Math.min(1774-w,Math.max(0,(a+d-w)/2)),y=Math.min(887-h,Math.max(0,(b+e-h)/2));ctx.drawImage(v,x/1774*1776,row*888+y/887*888,w/1774*1776,h/887*888,0,0,c.width,c.height)}else ctx.drawImage(v,0,row*888,1776,888,0,0,c.width,c.height)}seek.value=v.currentTime;$('time').textContent=`${v.currentTime.toFixed(1)} / 8.0 s`;sound.update({mix:audioMix})}
function tick(){draw();v.requestVideoFrameCallback?.(tick)}
$('play').onclick=async()=>{if(v.paused){try{await v.play()}catch{$('status').textContent='Press Play to start the film.'}}else v.pause()};
v.onplay=()=>{$('play').textContent='Pause';$('status').textContent='Playing · choose a region to inspect its motion'};v.onpause=()=>{$('play').textContent='Play';$('status').textContent='Paused · drag the timeline to inspect a pose'};
$('rate').onchange=()=>v.playbackRate=Number($('rate').value);seek.oninput=()=>{v.currentTime=Number(seek.value)};v.onseeked=draw;
try{const r=await fetch('review.mp4');if(!r.ok)throw Error('load');v.src=URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:'video/mp4'}));v.addEventListener('loadeddata',()=>{draw();if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(tick);else setInterval(draw,33);v.play().catch(()=>{$('status').textContent='Ready · press Play to begin'})},{once:true})}catch{$('status').textContent='The film could not load. Please refresh.'}
</script></html>
