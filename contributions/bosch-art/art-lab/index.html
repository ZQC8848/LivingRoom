<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画外之证 · 14 个互动实验</title><style>html,body{margin:0;background:#151613}body{max-width:1320px;margin:auto}</style><div id="painting-lab">

    @media(prefers-reduced-motion:reduce){#painting-lab *{scroll-behavior:auto}}
  </style>
  <div class="masthead"><div class="wordmark">画外之证</div><div class="edition">IMMERSION / INTERACTION STUDIES<br>低保真体验集 · 14 个可操作实验</div></div>
  <div class="layout">

      <p class="question"></p>
      <div class="review"><span class="review-label">这条方向</span><button type="button" data-rating="值得深化" aria-pressed="false">值得深化</button><button type="button" data-rating="还没成立" aria-pressed="false">还没成立</button><button type="button" data-rating="暂不考虑" aria-pressed="false">暂不考虑</button><button type="button" class="about" aria-expanded="false">依据与改编 ↗</button></div>

  <script>
  (()=>{
    const root=document.getElementById('painting-lab');
    const STUDIES = [
  {id:'levi', group:'新方向', title:'谁能留在画里', art:'《利未家的宴会》 · 委罗内塞，1573', asset:'levi', type:'censor', palette:['#211912','#c8ad78'], action:'批准下一次删改', finish:'只改题名，让所有人回来', steps:4,
    intro:'你被要求判断：哪些人，不该出现在这场宴席？', gesture:'点人物标记，或按下方按钮执行一次删改',
    states:['宴席尚未经过你的筛选。','一个人被遮去了；原来的位置留着痕迹。','又一段交谈失去了参与者。','宴会越来越合规，也越来越空。','人都回来了。改变的只有题名。'],
    question:'当你让图像变得“正确”，你替谁行使了权力？',
    fact:'画家因这幅原拟《最后的晚餐》的作品受到质询，最后通过改变题名和对应经文回应。', proposal:'人物逐次被遮去是当代改编；历史上的关键是改题，而非这套删人过程。',
    source:'https://www.gallerieaccademia.it/opera/convito-in-casa-di-levi/', hot:[[.35,.74],[.67,.70],[.85,.73]], hotlabels:['宴席旁的人','右侧宾客','边缘人物']},
  {id:'cards', group:'新方向', title:'知情的旁观者', art:'《纸牌作弊者》 · 卡拉瓦乔，约1594', asset:'cards', type:'evidence', palette:['#15120f','#bda26b'], action:'揭示下一条证据', finish:'让他意识到你在场', steps:3,
    intro:'先看脸。谁值得相信？再去看他们的手。', gesture:'点画中的圆点，查看手势与藏牌',
    states:['你还可以说，自己什么都不知道。','这只手在传递什么？','背后的纸牌，使刚才的手势有了另一种解释。','你已看见骗局；现在，画里的人也“知道”了。'],
    question:'知情之后，你还是一个没有立场的观众吗？',
    fact:'画中包含窥牌、传递信号与藏牌等相互关联的动作。', proposal:'最后的回望由目光线和台词占位，是我们拟议的互动，不是原画中已有的动画。',
    source:'https://kimbellart.org/collection/ap-198706', hot:[[.47,.30],[.85,.76]], hotlabels:['传递信号的手','藏在背后的牌']},
  {id:'repin', group:'新方向', title:'问题改变目光', art:'《不期而至》 · 列宾，1884—1888', asset:'repin', type:'task', palette:['#1e211c','#bbc2a7'], action:'换一个问题', finish:'比较两次选择', steps:2,
    intro:'他离开这个家，已经多久？点出支持你判断的细节。', gesture:'点选画中证据；换题后再选一次',
    states:['问题一：他离开了多久？','问题二：他们欢迎他的归来吗？','同一张画，你刚才选中了哪些不同的细节？'],
    question:'是画面告诉了你答案，还是提问替你筛选了证据？',
    fact:'Yarbus 以这幅画研究任务与观看的关系；后续研究重新检验了不同任务对眼动的影响。', proposal:'这里记录点击选择，不是眼动。“是否欢迎他”是本原型的新问题。',
    source:'https://doi.org/10.1080/13506280902793843', hot:[[.28,.43],[.46,.37],[.79,.54],[.57,.68]], hotlabels:['衣着与来客','起身的长者','桌边的反应','室内的关系']},
  {id:'damage', group:'新方向', title:'修复还是编造', art:'虚构情境 · 借用《纸牌作弊者》', asset:'cards', type:'damage', palette:['#211a22','#ccadbe'], action:'显露一处残存证据', finish:'切换：保留缺口 / 推断补全', steps:3,
    intro:'一次虚构的泼染事件后，你收到一张模糊的图像。', gesture:'移动手形光圈，或点击显露按钮；比较两种“修复”',
    states:['污损让判断变得困难。清晰，也可能是一种诱惑。','一处手的细节可以辨认，其他位置仍然不确定。','更多证据显露了，但缺口还没有消失。','补全能让画面完整；完整不等于已经得到证实。'],
    question:'当补全看起来足够可信，你还记得哪里曾经缺失吗？',
    fact:'本场景使用真实原画作为素材；泼染事件、损坏状态与修复任务全部虚构。', proposal:'此版用模糊、擦除和原图采样模拟修复流程；尚未调用生成模型，推断区域会保留标识。',
    source:'https://kimbellart.org/collection/ap-198706', hot:[[.47,.30],[.85,.76],[.27,.30]], hotlabels:['第一处残片','第二处残片','第三处残片']},
  {id:'meninas', group:'新方向', title:'谁站在画外', art:'《宫娥》 · 委拉斯开兹，1656', asset:'meninas', type:'gaze', palette:['#151716','#b9b9a0'], action:'站在“被画的人”的位置', finish:'返回观看者的身份', steps:2,
    intro:'你以为自己站在画外。画中人的目光却向这里聚拢。', gesture:'切换身份，留意目光与远处的镜子',
    states:['你正在看他们。','这里也可能是被描绘者的位置。','位置没有改变；“谁在看谁”变了。'],
    question:'你的观看位置，是否已经被这幅画预先安排？',
    fact:'画面包含画家、宫廷人物，以及映出国王和王后的后墙镜子。', proposal:'目光连线和“角色切换”是空间设计解释，不主张复原唯一正确的构图解读。',
    source:'https://content.cdnprado.net/doclinks/pdf/aprende/educacion/accesibles/guia_visual_museo-del-prado_en.pdf', hot:[[.48,.32],[.23,.32],[.63,.51]], hotlabels:['远处的镜子','画家的目光','面向这里的人']},
  {id:'mirror', group:'新方向', title:'镜子里的证人', art:'《阿尔诺芬尼夫妇像》 · 扬·凡·艾克，1434', asset:'arnolfini', type:'mirror', palette:['#121b16','#9daf87'], action:'举起镜面透镜', finish:'把观看者写进镜子', steps:2,
    intro:'房间里似乎只有两个人。镜子记下的却不止这些。', gesture:'举起透镜看镜面；再测试“你也在里面”的改编',
    states:['先看房间，再看镜子。','镜子揭示了直接画面之外的在场者。','此处新增的观看者轮廓是改编：你也成为了被记录的人。'],
    question:'图像中的证人，可以替一个事件作多少保证？',
    fact:'原画的凸面镜映出房间与额外的人物；画作身份和叙事解释存在讨论。', proposal:'镜中新增轮廓属于拟议互动；不把婚礼见证等有争议的解释当作定论。',
    source:'https://www.nationalgallery.org.uk/painting-items/jan-van-eyck-the-arnolfini-portrait', hot:[[.50,.37]], hotlabels:['后墙凸面镜']},
  {id:'skull', group:'新方向', title:'被校正的死亡', art:'《大使们》 · 小汉斯·霍尔拜因，1533', asset:'ambassadors', type:'anamorph', palette:['#151c19','#b7b599'], action:'举起校正镜筒', finish:'收起镜筒', steps:2,
    intro:'仪器、织物和身份都可以辨认。脚下却有一个难以辨认的形状。', gesture:'用镜筒切换辨认方式；身体与镜头保持原位',
    states:['地上的形状拒绝正面观看。','镜筒中显示局部拉伸校正示意。','被遮住的不是死亡；是让它容易被忽略的观看方式。'],
    question:'知识与身份摆在眼前，什么仍然被我们看成噪声？',
    fact:'前景包含变形骷髅；国家美术馆的研究讨论了斜视和曲面镜等观看方式。', proposal:'本版采用局部图像拉伸作为低保真占位，未作原作光学校准，也不模拟身体移动。',
    source:'https://www.nationalgallery.org.uk/paintings/catalogues/foister-2024/the-ambassadors', hot:[[.51,.83]], hotlabels:['变形的前景']},
  {id:'bayeux', group:'新方向', title:'谁写下了字幕', art:'《贝叶挂毯》 · 11世纪，局部', asset:'bayeux', type:'caption', palette:['#252018','#c2ae7e'], action:'移除叙述者的字幕', finish:'换一位当代叙述者', steps:2,
    intro:'图像之上，已经有人替你写好了这场冲突。', gesture:'去掉字幕，再比较两种当代叙述',
    states:['先接受现成的故事。','文字被遮住了：你凭什么确认每个人的身份？','现在的两种字幕都是设计改写；它们正在争夺同一幅图像。'],
    question:'当图像保持不变，谁能把它命名为胜利或灾难？',
    fact:'挂毯用图像与拉丁文字共同叙事，本素材为其中一段。', proposal:'替换字幕是当代立场实验，非原文翻译；此版不裁定哈罗德死亡图像的争议细节。',
    source:'https://www.bayeuxmuseum.com/en/the-bayeux-tapestry/', hot:[[.32,.14],[.66,.14]], hotlabels:['文字与图像','被命名的事件']},
  {id:'harvest', group:'新方向', title:'风景由谁维持', art:'《收割者》 · 老彼得·勃鲁盖尔，1565', asset:'harvest', type:'labor', palette:['#262315','#c8b16d'], action:'看见维持风景的人', finish:'让风景回到“空无一人”', steps:2,
    intro:'先把它当成一幅安静的田园。再找出这份安静依赖的人。', gesture:'切换人物显隐；寻找休息、劳作与搬运',

      $$('[data-rating]').forEach(b=>b.setAttribute('aria-pressed',s.rating===b.dataset.rating));

      $('.quality-label').textContent=['低 · 像素／残损可读性试验','中 · 低保真空间模拟','高 · 原画细节参照'][fidelity];
      dirty=true;
    }
    function setStudy(id){current=STUDIES.find(s=>s.id===id)||STUDIES[0];yaw=0;pitch=0;ptr={u:.5,v:.5};loadImage(current.asset);$('.hotspots').replaceChildren();current.hot.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='hotspot';b.textContent=String(i+1);b.setAttribute('aria-label',current.hotlabels[i]||'画中细节');b.addEventListener('click',()=>hit(i));$('.hotspots').append(b);});renderUI();}
    function hit(i){const s=state();if(!s.visited.includes(i))s.visited.push(i);
      if(current.type==='task'){const q=Math.min(s.phase,1);const j=s.picks[q].indexOf(i);j<0?s.picks[q].push(i):s.picks[q].splice(j,1);}
      else if(['evidence','censor','damage'].includes(current.type))s.phase=clamp(Math.max(s.phase,i+1),0,current.steps);
      else if(current.type==='gravity')s.phase=i;
      else if(current.type==='choice')s.phase=i+1;
      else if(current.type==='time')s.phase=(s.phase+1)%(current.steps+1);
      else s.phase=s.phase?0:1;
      renderUI();persist();}
    function advance(){const s=state();
      if(current.type==='damage'&&s.phase>=3)s.lens=!s.lens;
      else if(current.type==='caption'&&s.phase>=2)s.lens=!s.lens;
      else {s.phase=(s.phase+1)%(current.steps+1);if(current.type==='weather')s.weather=s.phase>=4?0:s.phase;}
      renderUI();persist();}
    function nav(){const rail=$('.rail');for(const group of ['新方向','既有方向']){const label=document.createElement('div');label.className='rail-label'+(group==='既有方向'?' second':'');label.textContent=group+' / '+(group==='新方向'?'10':'4');rail.append(label);const opt=document.createElement('optgroup');opt.label=group;STUDIES.filter(s=>s.group===group).forEach(s=>{const i=STUDIES.indexOf(s);const b=document.createElement('button');b.type='button';b.className='study';b.dataset.study=s.id;b.setAttribute('aria-pressed',s.id===current.id);const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=s.title;b.append(n,t);b.addEventListener('click',()=>{setStudy(s.id);persist()});rail.append(b);const o=document.createElement('option');o.value=s.id;o.textContent=String(i+1).padStart(2,'0')+' · '+s.title;opt.append(o);});$('.mobile-picker').append(opt);}}
    nav();$('.mobile-picker').addEventListener('change',e=>{setStudy(e.target.value);persist()});$('.advance').addEventListener('click',advance);
    $('.restart').addEventListener('click',()=>{const rating=state().rating;store[current.id]={phase:0,visited:[],picks:[[],[]],rating,lens:false};yaw=0;pitch=0;renderUI();persist()});
    $$('[data-turn]').forEach(b=>b.addEventListener('click',()=>{const v=Number(b.dataset.turn);yaw=v===0?0:v===180?Math.PI:yaw+v*Math.PI/180;pitch=0;dirty=true;}));
    $$('[data-rating]').forEach(b=>b.addEventListener('click',()=>{state().rating=state().rating===b.dataset.rating?null:b.dataset.rating;renderUI();persist()}));
    $('.about').addEventListener('click',()=>{const open=$('.evidence').hidden;$('.evidence').hidden=!open;$('.about').setAttribute('aria-expanded',open)});
    $('.fidelity').addEventListener('input',e=>{fidelity=Number(e.target.value);renderUI();persist()});
    $('.weather input').addEventListener('input',e=>{state().weather=Number(e.target.value);state().phase=Math.round(Number(e.target.value));renderUI();persist()});
    let drag=null;
    canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:0};if(video&&!videoReady)video.play().catch(()=>{});});
    canvas.addEventListener('pointermove',e=>{ptr=pointerUV(e);if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=clamp(pitch+dy*.004,-1.1,1.1);drag.x=e.clientX;drag.y=e.clientY;dirty=true;}else if(current.type==='portal'&&state().phase===1)dirty=true;});
    canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<7){ptr=pointerUV(e);let best=-1,d=.09;current.hot.forEach((p,i)=>{const u=(rect.x+p[0]*rect.w)/W,v=(rect.y+p[1]*rect.h)/H;const dist=Math.hypot((ptr.u-u)*2,ptr.v-v);if(dist<d){d=dist;best=i;}});if(best>=0)hit(best);}drag=null;});
    canvas.addEventListener('pointercancel',()=>{drag=null});
    window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.modelContent;if(v?.studies){store=v.studies;setStudy(v.selected||current.id)}});
    const ro=new ResizeObserver(resize);ro.observe(stage);
    try{initGL();setStudy(current.id);requestAnimationFrame(drawFrame);}catch(e){$('.error').hidden=false;$('.error').textContent=e.message;}
    // Read-only hooks for smoke checks; no network or external model calls.
    root.paintingLab={select:setStudy,advance,hit,state:()=>({id:current.id,...state(),yaw,pitch,fidelity,frameStats:{...frameStats},videoTracks:stream?.getVideoTracks().length||0,panorama:[W,H]}),studies:STUDIES.map(s=>({id:s.id,type:s.type,steps:s.steps})),readPano:()=>pano.toDataURL('image/jpeg',.8)};
  })();
  </script>
</div>
</html>
