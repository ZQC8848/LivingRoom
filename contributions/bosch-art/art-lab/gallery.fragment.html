  <style>

  <div class="masthead"><div class="wordmark">画外之证</div><div class="edition">THE OTHER SIDE<br>画廊 → 画中世界 → 再次观看</div></div>

      <div class="evidence" hidden><p class="fact"></p><p class="proposal"></p><p>本版为画廊与全景构图草图；火焰为程序动效占位。尚未调用视频模型，也未接头显手势。画作向全景的延展属于当代改编。</p><a class="research-link" target="_blank" rel="noopener noreferrer">查看研究／馆藏来源</a> · <a class="image-link" target="_blank" rel="noopener noreferrer">图像来源</a></div>
    </main>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('painting-lab');
    /*__STUDIES__*/
    const ASSETS=/*__ASSETS__*/;
    const $=s=>root.querySelector(s), $$=s=>[...root.querySelectorAll(s)];
    const saved=window.openai?.widgetState?.modelContent;
    const boschStudy=STUDIES.find(s=>s.id==='bosch');
    Object.assign(boschStudy,{action:'举手，揭开另一面',finish:'放下手，回到花园',steps:1,intro:'花园安静地包围着你。',states:['花园安静地包围着你。','透过手中的缺口，另一联的黑暗与火焰显露了。'],question:'看见另一面之后，你还能只看见这座花园吗？'});
    let current=STUDIES.find(s=>s.id===(saved?.version===2?saved.selected:'bosch'))||boschStudy;
    let store=saved?.version===2?saved.studies||{}:{}, yaw=0,pitch=0,fidelity=2,ptr={u:.5,v:.5},dirty=true,lastFrame=0;
    let mode='gallery',sceneTime=0,transitioning=false,effects=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const visited=new Set(saved?.version===2?saved.visited||[]:[]),revealed=new Set(saved?.version===2?saved.revealed||[]:[]);
    const galleryOrder=['bosch','cards','levi','repin','meninas','mirror','skull','bayeux','harvest','miser','spring','han','escher','damage'];
    const galleryFrames=[];let galleryYaw=0;
    const W=2048,H=1024,TAU=Math.PI*2;
    const pano=document.createElement('canvas');pano.width=W;pano.height=H;
    const ctx=pano.getContext('2d',{alpha:false});
    const art=document.createElement('canvas');art.width=1200;art.height=800;
    const ac=art.getContext('2d');
    const raw=document.createElement('canvas');raw.width=1200;raw.height=800;
    const rc=raw.getContext('2d');
    const low=document.createElement('canvas');const lc=low.getContext('2d');
    const gardenLayer=document.createElement('canvas'),hellLayer=document.createElement('canvas'),hellFrame=document.createElement('canvas');
    [gardenLayer,hellLayer,hellFrame].forEach(c=>{c.width=W;c.height=H});
    let boschLayersReady=false;
    const imgs={}; let rect={x:650,y:320,w:748,h:384};
    const canvas=$('.world'), stage=$('.stage');
    const gl=canvas.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:true});
    let program,texture,uniforms,video,stream,videoReady=false,usingVideo=false;
    let frameStats={frames:0,source:'initializing',singlePanorama:true};
    const state=()=>store[current.id]||(store[current.id]={phase:0,visited:[],picks:[[],[]],rating:null,lens:false});
    const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
    function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{version:2,selected:current.id,studies:store,visited:[...visited],revealed:[...revealed]},privateContent:{mode,yaw,pitch,fidelity,effects}}).catch(()=>{});}
    function shader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));return sh;}
    function initGL(){
      if(!gl)throw new Error('当前环境没有可用的 WebGL；请打开浏览器版本。');
      program=gl.createProgram();
      gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p; varying vec2 uv; void main(){uv=p;gl_Position=vec4(p,0.,1.);}'));
      gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision highp float;varying vec2 uv;uniform sampler2D pano;uniform vec2 view;uniform float aspect;uniform float halfFov;
      void main(){vec3 r=normalize(vec3(uv.x*aspect*halfFov,uv.y*halfFov,1.));float cp=cos(view.y),sp=sin(view.y);r=vec3(r.x,r.y*cp+r.z*sp,-r.y*sp+r.z*cp);float cy=cos(view.x),sy=sin(view.x);r=vec3(r.x*cy+r.z*sy,r.y,-r.x*sy+r.z*cy);vec2 t=vec2(fract(atan(r.x,r.z)/6.28318530718+.5),.5-asin(clamp(r.y,-1.,1.))/3.14159265359);vec3 c=texture2D(pano,t).rgb;float edge=1.-.16*pow(length(uv*.65),2.);gl_FragColor=vec4(c*edge,1.);}`));
      gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));gl.useProgram(program);
      const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
      texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      uniforms={view:gl.getUniformLocation(program,'view'),aspect:gl.getUniformLocation(program,'aspect'),halfFov:gl.getUniformLocation(program,'halfFov')};
      if(pano.captureStream){
        try{stream=pano.captureStream(12);video=document.createElement('video');video.muted=true;video.playsInline=true;video.autoplay=true;video.srcObject=stream;video.addEventListener('loadeddata',()=>{videoReady=true;dirty=true});video.play().catch(()=>{});}catch(e){frameStats.videoError=e.message;}
      }
      resize();
    }
    function resize(){const b=stage.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,1.5);canvas.width=Math.max(1,Math.round(b.width*d));canvas.height=Math.max(1,Math.round(b.height*d));if(gl)gl.viewport(0,0,canvas.width,canvas.height);dirty=true;}
    function loadImage(key){if(!key||imgs[key])return;const info=ASSETS[key];if(!info?.src)return;const im=new Image();im.onload=()=>{imgs[key]=im;dirty=true};im.onerror=()=>{$('.error').hidden=false;$('.error').textContent='图像未能载入：'+key};im.src=info.src;}
    function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
    function line(c,x1,y1,x2,y2,color,width=2){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
    function ring(c,x,y,r,color){c.strokeStyle=color;c.lineWidth=4;c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();}
    function ell(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill();}
    function text(c,str,x,y,size=22,color='#e6dcc2',align='center'){c.fillStyle=color;c.font=`${size}px system-ui,"Microsoft YaHei",sans-serif`;c.textAlign=align;c.fillText(str,x,y);}
    function patch(c,point,index,alpha=1){const x=point[0]*1200,y=point[1]*800;c.save();c.globalAlpha=alpha;ell(c,x,y,46,115,'#c7b68e');for(let j=0;j<9;j++)line(c,x-48,y-100+j*25,x+48,y-120+j*25,'#9d8d6b',2);text(c,'∅',x,y+7,28,'#5c4a32');c.restore();}
    function drawGeometry(){
      rc.fillStyle='#c1bcac';rc.fillRect(0,0,1200,800);
      rc.strokeStyle='#35352e';rc.lineWidth=3;
      const poly=(p,fill)=>{rc.fillStyle=fill;rc.beginPath();p.forEach(([x,y],i)=>i?rc.lineTo(x,y):rc.moveTo(x,y));rc.closePath();rc.fill();rc.stroke();};
      poly([[140,260],[600,70],[1080,270],[610,500]],'#dfdccf');poly([[140,260],[610,500],[610,735],[140,515]],'#97998b');poly([[610,500],[1080,270],[1080,515],[610,735]],'#aaa998');
      for(let i=0;i<12;i++){const x=235+i*34,y=320-i*14;poly([[x,y],[x+68,y-28],[x+108,y-12],[x+40,y+17]],'#e3e0d2');poly([[x+40,y+17],[x+108,y-12],[x+108,y+6],[x+40,y+34]],'#878879');}
      for(let i=0;i<11;i++){const x=728+i*25,y=510-i*12;poly([[x,y],[x+45,y-22],[x+45,y+12],[x,y+35]],'#d0cdbd');line(rc,x,y+35,x-25,y+23,'#414238',2);}
      for(let i=0;i<10;i++){const x=325+i*29,y=555+i*14;poly([[x,y],[x+57,y-20],[x+85,y-6],[x+27,y+17]],'#d6d4c6');line(rc,x+27,y+17,x+27,y+38,'#424338',2);}
      const st=state();[[345,280,0],[830,360,1],[600,580,2]].forEach(([x,y,g])=>{rc.save();rc.translate(x,y);rc.rotate(g*TAU/3);const active=st.phase>=3||st.phase===g;rc.fillStyle=active?'#353b2d':'#777b6c';ell(rc,0,-15,13,15,rc.fillStyle);roundRect(rc,-11,3,22,47,6);rc.fill();line(rc,-5,47,-14,80,rc.fillStyle,8);line(rc,5,47,17,76,rc.fillStyle,8);text(rc,'↓',46,35,46,active?'#4a5e31':'#858878');rc.restore();});
      for(let i=0;i<70;i++)line(rc,150+i*12,670,185+i*12,685,'#6c6c6045',1);

        gl.uniform2f(uniforms.view,yaw,pitch);gl.uniform1f(uniforms.aspect,canvas.width/canvas.height);gl.uniform1f(uniforms.halfFov,Math.tan(59*Math.PI/360));gl.drawArrays(gl.TRIANGLE_STRIP,0,4);positionHotspots();frameStats.frames++;dirty=false;lastFrame=t;
      }requestAnimationFrame(drawFrame);
    }
    function renderUI(){
      root.dataset.mode=mode;
      $('.return-gallery').hidden=mode==='gallery';
      $('.effects').checked=effects;
      $('.effect-control').style.display=mode==='world'&&current.id==='bosch'?'flex':'none';
      if(mode==='gallery'){
        $('.study-title').textContent='每一幅画，都有另一面';$('.art-name').textContent='已选：'+current.art;$('.index').textContent='画廊 / 14';
        $('.location').textContent='画廊 · 原地环顾';$('.action-label').textContent='进入'+(current.art.match(/《[^》]+》/)?.[0]||'这个世界');$('.step-count').textContent='→';
        $('.stage-help span').textContent='拖动画面环顾 · 点击画作或“进入”';$('.gesture').textContent='';$('.question').textContent='';$('.evidence').hidden=true;
        $('.subtitle span').textContent=revealed.has(current.id)?'画框仍在原处。你已经看见过它的另一面。':'四周的画作，正等待一次不同的观看。';
        $('.gallery-description').textContent=revealed.has('bosch')?'《人间乐园》留下了一道暗红色痕迹。刚才的观看，已经进入画廊。':'画作分布在你的四周。选择一幅，留在原地进入它的世界。';
        $('.weather').style.display='none';$('.mobile-picker').value=current.id;dirty=true;return;
      }
      $('.location').textContent='画中世界 · 固定位置';$('.stage-help span').textContent='拖动画面转头 · 点圆点或按钮代替手势';
      $('.effect-control').style.display=current.id==='bosch'?'flex':'none';
      const s=state();$('.study-title').textContent=current.title;$('.art-name').textContent=current.art;$('.index').textContent=String(STUDIES.indexOf(current)+1).padStart(2,'0')+' / 14';$('.gesture').textContent=current.type==='task'?`已选 ${s.picks[Math.min(s.phase,1)].length} 处证据`:current.type==='portal'?'举起透镜后移动鼠标':'';
      let caption=s.phase?current.states[Math.min(s.phase,current.states.length-1)]:current.intro;
      if(current.type==='damage'&&s.phase===3)caption=s.lens?'推断补全：清晰区域保留“推断”标识。':'保留缺口：不替未知部分作证。';
      if(current.type==='caption'&&s.phase===2)caption=s.lens?'改写 B：失去世界的人。':'改写 A：被命名的胜利。';
      $('.subtitle span').textContent=caption;$('.question').textContent=current.question;
      $('.action-label').textContent=s.phase===current.steps-1?current.finish:s.phase>=current.steps?(['damage','caption'].includes(current.type)?current.finish:'再体验一次'):current.action;
      if(current.id==='bosch')$('.action-label').textContent=s.phase===1?'放下手，回到花园':'举手，揭开另一面';
      $('.step-count').textContent=Math.min(s.phase,current.steps)+' / '+current.steps;
      $('.fact').replaceChildren();const f=document.createElement('strong');f.textContent='已有依据　';$('.fact').append(f,document.createTextNode(current.fact));
      $('.proposal').replaceChildren();const p=document.createElement('strong');p.textContent='本次改编　';$('.proposal').append(p,document.createTextNode(current.proposal));
      $('.research-link').href=current.source;$('.image-link').href=ASSETS[current.asset]?.source||current.source;
      $$('.study').forEach(b=>b.setAttribute('aria-pressed',b.dataset.study===current.id));$('.mobile-picker').value=current.id;
      $$('[data-rating]').forEach(b=>b.setAttribute('aria-pressed',s.rating===b.dataset.rating));
      $('.weather').style.display=current.type==='weather'?'flex':'none';$('.weather input').value=s.weather??s.phase;
      $('.quality-label').textContent=['低 · 像素／残损可读性试验','中 · 低保真空间模拟','高 · 原画细节参照'][fidelity];
      dirty=true;
    }
    function setStudy(id){current=STUDIES.find(s=>s.id===id)||boschStudy;yaw=0;pitch=0;ptr={u:.5,v:.5};loadImage(current.asset);$('.hotspots').replaceChildren();
      if(mode==='gallery'){
        yaw=galleryOrder.indexOf(current.id)*TAU/galleryOrder.length;
        galleryOrder.forEach(id=>{const study=STUDIES.find(s=>s.id===id),b=document.createElement('button');b.type='button';b.className='gallery-painting';b.dataset.painting=id;b.textContent='进入';b.setAttribute('aria-label','进入'+study.art);b.addEventListener('click',()=>enterWorld(id));$('.hotspots').append(b);});
      }else current.hot.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='hotspot';b.textContent=String(i+1);b.setAttribute('aria-label',current.hotlabels[i]||'画中细节');b.addEventListener('click',()=>hit(i));$('.hotspots').append(b);});renderUI();}
    function fadeTo(change){
      if(transitioning)return;transitioning=true;$('.fade').style.opacity='1';$('.advance').disabled=true;
      setTimeout(()=>{change();dirty=true;setTimeout(()=>{$('.fade').style.opacity='0';$('.advance').disabled=false;transitioning=false;persist();},120);},240);
    }
    function enterWorld(id){
      galleryYaw=yaw;
      fadeTo(()=>{mode='world';if(!visited.has(id)||id==='bosch'){const rating=store[id]?.rating||null;store[id]={phase:0,visited:[],picks:[[],[]],rating,lens:false};}visited.add(id);setStudy(id);});
    }
    function returnGallery(){fadeTo(()=>{mode='gallery';setStudy(current.id);yaw=galleryYaw;});}
    function hit(i){const s=state();if(!s.visited.includes(i))s.visited.push(i);
      if(current.type==='task'){const q=Math.min(s.phase,1);const j=s.picks[q].indexOf(i);j<0?s.picks[q].push(i):s.picks[q].splice(j,1);}
      else if(['evidence','censor','damage'].includes(current.type))s.phase=clamp(Math.max(s.phase,i+1),0,current.steps);
      else if(current.type==='gravity')s.phase=i;
      else if(current.type==='choice')s.phase=i+1;
      else if(current.type==='time')s.phase=(s.phase+1)%(current.steps+1);
      else s.phase=s.phase?0:1;
      if(current.id==='bosch'&&s.phase===1)revealed.add(current.id);
      renderUI();persist();}
    function advance(){const s=state();
      if(mode==='gallery'){enterWorld(current.id);return;}
      if(current.type==='damage'&&s.phase>=3)s.lens=!s.lens;
      else if(current.type==='caption'&&s.phase>=2)s.lens=!s.lens;
      else {s.phase=(s.phase+1)%(current.steps+1);if(current.type==='weather')s.weather=s.phase>=4?0:s.phase;}
      if(s.phase>0)revealed.add(current.id);
      renderUI();persist();}
    function nav(){const rail=$('.rail');for(const group of ['新方向','既有方向']){const label=document.createElement('div');label.className='rail-label'+(group==='既有方向'?' second':'');label.textContent=group+' / '+(group==='新方向'?'10':'4');rail.append(label);const opt=document.createElement('optgroup');opt.label=group;STUDIES.filter(s=>s.group===group).forEach(s=>{const i=STUDIES.indexOf(s);const b=document.createElement('button');b.type='button';b.className='study';b.dataset.study=s.id;b.setAttribute('aria-pressed',s.id===current.id);const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=s.title;b.append(n,t);b.addEventListener('click',()=>{setStudy(s.id);persist()});rail.append(b);const o=document.createElement('option');o.value=s.id;o.textContent=String(i+1).padStart(2,'0')+' · '+s.title;opt.append(o);});$('.mobile-picker').append(opt);}}
    nav();$('.mobile-picker').addEventListener('change',e=>{setStudy(e.target.value);persist()});$('.advance').addEventListener('click',advance);
    $('.return-gallery').addEventListener('click',returnGallery);
    $('.effects').addEventListener('change',e=>{effects=e.target.checked;dirty=true;persist()});
    $('.restart').addEventListener('click',()=>{const rating=state().rating;store[current.id]={phase:0,visited:[],picks:[[],[]],rating,lens:false};yaw=0;pitch=0;renderUI();persist()});
    $$('[data-turn]').forEach(b=>b.addEventListener('click',()=>{const v=Number(b.dataset.turn);yaw=v===0?0:v===180?Math.PI:yaw+v*Math.PI/180;pitch=0;dirty=true;}));
    $$('[data-rating]').forEach(b=>b.addEventListener('click',()=>{state().rating=state().rating===b.dataset.rating?null:b.dataset.rating;renderUI();persist()}));
    $('.about').addEventListener('click',()=>{const open=$('.evidence').hidden;$('.evidence').hidden=!open;$('.about').setAttribute('aria-expanded',open)});
    $('.fidelity').addEventListener('input',e=>{fidelity=Number(e.target.value);renderUI();persist()});
    $('.weather input').addEventListener('input',e=>{state().weather=Number(e.target.value);state().phase=Math.round(Number(e.target.value));renderUI();persist()});
    let drag=null;
    canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:0};if(video&&!videoReady)video.play().catch(()=>{});});
    canvas.addEventListener('pointermove',e=>{ptr=pointerUV(e);if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=clamp(pitch+dy*.004,-1.1,1.1);drag.x=e.clientX;drag.y=e.clientY;dirty=true;}else if(current.type==='portal'&&state().phase===1)dirty=true;});
    canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<7){ptr=pointerUV(e);
      if(mode==='gallery'){
        const x=ptr.u*W,y=ptr.v*H;const f=galleryFrames.find(f=>[-W,0,W].some(d=>x>=f.x+d&&x<=f.x+d+f.w&&y>=f.y&&y<=f.y+f.h));if(f)enterWorld(f.id);
      }else{let best=-1,d=.09;current.hot.forEach((p,i)=>{const u=(rect.x+p[0]*rect.w)/W,v=(rect.y+p[1]*rect.h)/H;const dist=Math.hypot((ptr.u-u)*2,ptr.v-v);if(dist<d){d=dist;best=i;}});if(best>=0)hit(best);}
    }drag=null;});
    canvas.addEventListener('pointercancel',()=>{drag=null});
    window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.modelContent;if(v?.version===2&&v.studies){store=v.studies;(v.visited||[]).forEach(id=>visited.add(id));(v.revealed||[]).forEach(id=>revealed.add(id));setStudy(v.selected||current.id)}});
    const ro=new ResizeObserver(resize);ro.observe(stage);
    try{initGL();Object.keys(ASSETS).forEach(loadImage);setStudy(current.id);requestAnimationFrame(drawFrame);}catch(e){$('.error').hidden=false;$('.error').textContent=e.message;}
    // Read-only hooks for smoke checks; no network or external model calls.
    root.paintingLab={select:setStudy,enter:enterWorld,gallery:returnGallery,advance,hit,state:()=>({id:current.id,mode,...state(),yaw,pitch,fidelity,effects,transitioning,visited:[...visited],revealed:[...revealed],frameStats:{...frameStats},videoTracks:stream?.getVideoTracks().length||0,panorama:[W,H],effectsSource:'procedural-placeholder'}),studies:STUDIES.map(s=>({id:s.id,type:s.type,steps:s.steps})),readPano:()=>pano.toDataURL('image/jpeg',.8)};
  })();
  </script>
